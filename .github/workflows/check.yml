name: teber-track

on:
  schedule:
    # 종가 기준 하루 2회
    #  - UTC 07:00 = KST 16:00 → 국장 종가 확정 후 (15:30 마감 +30분)
    #  - UTC 22:00 = KST 07:00 → 미장 종가 확정 후 (서머타임 무관)
    - cron: '0 7,22 * * *'
  workflow_dispatch:            # 수동 실행 버튼

permissions:
  contents: write               # state.json/data.json/history.csv 커밋용

concurrency:
  group: teber-track
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run tracker
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python main.py

      - name: Commit state & data & history
        run: |
          git config user.name "teber-track-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A state.json data.json || true
          git add -A history.csv || true
          git commit -m "update [skip ci]" || echo "no changes"
          git push || echo "nothing to push"
