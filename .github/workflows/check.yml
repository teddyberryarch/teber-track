name: teber-track

on:
  schedule:
    # 하루 6회 — 국장/미장 각각 개장·중반·종가 (KST 기준)
    #  UTC 01:00 = KST 10:00  국장 개장 후
    #  UTC 04:00 = KST 13:00  국장 중반
    #  UTC 07:00 = KST 16:00  국장 종가 확정
    #  UTC 15:00 = KST 24:00  미장 개장 후
    #  UTC 18:00 = KST 03:00  미장 중반
    #  UTC 22:00 = KST 07:00  미장 종가 확정 (서머타임 무관)
    - cron: '0 1,4,7,15,18,22 * * *'
  workflow_dispatch:            # 수동 실행 버튼

permissions:
  contents: write               # state.json/data.json/history.csv 커밋용

concurrency:
  group: teber-track
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run tracker
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python main.py

      - name: Commit state & data & history
        run: |
          git config user.name "teber-track-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A state.json data.json || true
          git add -A history.csv || true
          git commit -m "update [skip ci]" || echo "no changes"
          git push || echo "nothing to push"
